[tox]
envlist = py312-django52, quality
requires = tox-uv>=1

[testenv]
runner = uv-venv-lock-runner
dependency_groups = test
allowlist_externals = make
commands =
    make test PYTEST_ARGS="{posargs}"

[testenv:quality]
runner = uv-venv-lock-runner
dependency_groups = quality
allowlist_externals =
    make
commands =
    make quality

[pycodestyle]
max-line-length=130
exclude=migrations,.git
