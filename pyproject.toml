[build-system]
requires = ["setuptools", "setuptools-scm>8.1"]
build-backend = "setuptools.build_meta"

[project]
name = "edxval"
description = "edx-val"
readme = {text = "edx-val", content-type = "text/x-rst"}
requires-python = ">=3.12"
license = "AGPL-3.0-only"
license-files = ["LICENSE*"]
authors = [
    {name = "Open edX Project", email = "oscm@openedx.org"},
]
classifiers = [
    'Development Status :: 5 - Production/Stable',
    'Intended Audience :: Developers',
    'Operating System :: OS Independent',
    'Programming Language :: Python',
    'Programming Language :: Python :: 3',
    'Programming Language :: Python :: 3.12',
    'Framework :: Django',
    'Framework :: Django :: 5.2',
]

dynamic = ["version"]

dependencies = [
    "Django",
    "django-model-utils",
    "django-storages",
    "edx-drf-extensions",
    "edx-django-release-util",
    "pillow",
    "edx-toggles>=2.0.0",
    "lxml",
    "pysrt",
    "cachetools",
]

[project.urls]
Homepage = "https://github.com/openedx/edx-val"
Repository = "https://github.com/openedx/edx-val"

[dependency-groups]
test = [
    "Django>=5.2,<6.0",
    "boto3",
    "coverage",
    "ddt",
    "fs",
    "mock",
    "pytest-cov",
    "pytest-django",
    "responses",
]
quality = [
    {include-group = "test"},
    "build",
    "edx-lint",
    "isort",
    "pycodestyle",
    "pydocstyle",
    "twine",
]
ci = [
    "coveralls",
    "tox",
    "tox-uv",
]
dev = [
    {include-group = "quality"},
    {include-group = "ci"},
    "diff-cover",
]

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
where = ["src"]
exclude = ["edxval.settings", "edxval.settings.*"]

[tool.semantic_release]
build_command = "pip install build && SETUPTOOLS_SCM_PRETEND_VERSION=$NEW_VERSION python -m build"

[tool.setuptools_scm]
version_scheme = 'only-version'
local_scheme = 'no-local-version'
fallback_version = "0.0.0.dev0"

[tool.uv]
constraint-dependencies = [
    "Django<6.0",
    "elasticsearch<7.14.0",
    "social-auth-app-django<6.0.0",
    "social-auth-core<5.0.0",
    "pip<26.2.1",
    "setuptools<82",
]

[tool.edx_lint]
uv_constraints = [
    # setuptools 82+ removed pkg_resources, which fs (pyfilesystem2) uses for
    # namespace package declarations in fs/__init__.py. Pin until fs is updated.
    # See: https://github.com/PyFilesystem/pyfilesystem2/issues/577
    "setuptools<82",
]

[tool.coverage.run]
branch = true
source = ["src"]

[tool.coverage.report]
include = ["src/edxval/*"]
omit = [
    "*/settings.py",
    "*/migrations*",
]

[tool.coverage.html]
title = "edx-val Python Test Coverage Report"
directory = "html_coverage"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "edxval.settings.test"
addopts = "--cov --cov-report term-missing --cov-report xml"
norecursedirs = [".*", "docs", "video-images", "video-transcripts"]

[tool.isort]
default_section = "FIRSTPARTY"
line_length = 120
multi_line_output = 3
include_trailing_comma = true
known_third_party = ["pandas", "ddt", "httpretty", "mock", "freezegun", "rest_framework", "fs", "lxml", "pysrt", "django", "TimeStampedModel", "pysrt", "edx_rest_framework_extensions", "model_utils"]
skip = [
    "src/edxval/migrations/",
    "src/edxval/wsgi.py",
]

[tool.pydocstyle]
# error codes: https://pycodestyle.readthedocs.io/en/latest/intro.html#error-codes
# D100	Missing docstring in public module
# D101	Missing docstring in public class
# D102	Missing docstring in public method
# D104	Missing docstring in public package
# D105	Missing docstring in magic method
# D106	Missing docstring in public nested class
# D107	Missing docstring in __init__
# D200	One-line docstring should fit on one line with quotes
# D203	1 blank line required before class docstring
# D204: 1 blank line required after
# D205	1 blank line required between summary line and description
# D206	Docstring should be indented with spaces, not tabs
# D207	Docstring is under-indented
# D208	Docstring is over-indented
# D214   Section is over-indented
# D400	First line should end with a period
# D401	First line should be in imperative mood try rephrasing
# D402	First line should not be the functions signature
# D403	First word of the first line should be properly capitalized
# D404	First word of the docstring should not be This
# D406	Section name should end with a newline
# D407	Missing dashed underline after section
# D408	Section underline should be in the line following the sections name
# D409	Section underline should match the length of its name
# D410	Missing blank line after section
# D411	Missing blank line before section
# D413   Missing blank line after last section
# D415   First line should end with a period
# D417   Missing argument descriptions in the docstring
ignore = "D100, D101, D102, D104, D105, D106, D107, D200, D203, D204, D205, D210, D212, D213, D214, D400 ,D401, D403, D404, D406, D407, D408, D409, D410, D413, D415, D417"
